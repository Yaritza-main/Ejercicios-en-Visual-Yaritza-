<!DOCTYPE html>
<html>
<head>
    <title>Día de la Semana</title>
</head>
<body>

    <h2>Día de la Semana</h2>

    <input type="number" id="numero" placeholder="Ingrese un número del 1 al 7">
    <button onclick="mostrarDia()">Mostrar</button>

    <p id="resultado"></p>

    <script>
        function mostrarDia() {
            var numero = document.getElementById("numero").value;
            var dia;

            switch (numero) {
                case "1":
                    dia = "Lunes";
                    break;
                case "2":
                    dia = "Martes";
                    break;
                case "3":
                    dia = "Miércoles";
                    break;
                case "4":
                    dia = "Jueves";
                    break;
                case "5":
                    dia = "Viernes";
                    break;
                case "6":
                    dia = "Sábado";
                    break;
                case "7":
                    dia = "Domingo";
                    break;
                default:
                    dia = "Error: ingrese un número del 1 al 7";
            }

            document.getElementById("resultado").innerHTML = dia;
        }
    </script>

</body>
</html>
