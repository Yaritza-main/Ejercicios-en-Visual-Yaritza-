<!DOCTYPE html>
<html>
<head>
    <title>Conversor de Moneda</title>
</head>
<body>

    <h2>Conversor de Moneda</h2>

    <input type="number" id="cantidad" placeholder="Ingrese cantidad">

    <select id="moneda">
        <option value="1">Dólares</option>
        <option value="2">Euros</option>
        <option value="3">Lempiras</option>
    </select>

    <button onclick="convertir()">Convertir</button>

    <p id="resultado"></p>

    <script>
        function convertir() {
            var cantidad = Number(document.getElementById("cantidad").value);
            var moneda = document.getElementById("moneda").value;
            var resultado;

            switch (moneda) {
                case "1":
                    resultado = cantidad * 26;
                    document.getElementById("resultado").innerHTML = "Resultado: $" + resultado;
                    break;

                case "2":
                    resultado = cantidad * 30;
                    document.getElementById("resultado").innerHTML = "Resultado: €" + resultado;
                    break;

                case "3":
                    resultado = cantidad;
                    document.getElementById("resultado").innerHTML = "Resultado: L." + resultado;
                    break;
            }
        }
    </script>

</body>
</html>
