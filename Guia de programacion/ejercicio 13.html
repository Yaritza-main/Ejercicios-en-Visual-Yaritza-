<!DOCTYPE html>
<html>
<head>
    <title>Patron de Asteriscos</title>
</head>
<body>

    <h2>Patron de Asteriscos</h2>

    <input type="number" id="filas" placeholder="Ingrese las filas">
    <button onclick="mostrar()">Mostrar</button>

    <p id="resultado"></p>

    <script>
        function mostrar() {
            var filas = document.getElementById("filas").value;
            var resultado = "";

            for (var i = 1; i <= filas; i++) {

                for (var j = 1; j <= i; j++) {
                    resultado = resultado + "*";
                }

                resultado = resultado + "<br>";
            }

            document.getElementById("resultado").innerHTML = resultado;
        }
    </script>

</body>
</html>
